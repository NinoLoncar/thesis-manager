<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
	<title>Submission Details</title>
	<script th:inline="javascript">
		const submissionId = /*[[${submissionId}]]*/ null;
	</script>
	<script src="/js/submission/submission-details.js"></script>
</head>
<body>
<main layout:fragment="content">
	<h1 id="submission-title">Submission Details</h1>
	<table class="table w-auto">
		<tbody>
		<tr>
			<th scope="row">Version</th>
			<td id="submission-version"></td>
		</tr>
		<tr>
			<th scope="row">File</th>
			<td id="submission-file"></td>
		</tr>
		<tr>
			<th scope="row">Description</th>
			<td id="submission-description"></td>
		</tr>
		<tr>
			<th scope="row">Status</th>
			<td id="submission-status"></td>
		</tr>
		<tr>
			<th scope="row">Submitted by</th>
			<td id="submission-student"></td>
		</tr>
		<tr>
			<th scope="row">Reviewed by</th>
			<td id="submission-reviewer"></td>
		</tr>
		</tbody>
	</table>

	<a id="download-link" class="btn btn-primary" href="#" download>Download</a>
</main>
</body>
</html>
