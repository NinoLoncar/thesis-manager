<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
	<title>Submit New Version</title>
	<script th:inline="javascript">
		const thesisId = /*[[${thesisId}]]*/ null;
	</script>
	<script src="/js/submission/create-submission.js"></script>
</head>
<body>
<main layout:fragment="content">
	<h1>Submit New Version</h1>
	<form class="w-50">
		<div class="mb-3">
			<label for="file" class="form-label">File</label>
			<input type="file" id="file" name="file" class="form-control" accept="application/pdf" required>
		</div>
		<div class="mb-3">
			<label for="description" class="form-label">Description</label>
			<textarea id="description" name="description" class="form-control" rows="4"></textarea>
		</div>
		<button id="submit-btn" class="btn btn-primary">Submit</button>
	</form>
</main>
</body>
</html>
