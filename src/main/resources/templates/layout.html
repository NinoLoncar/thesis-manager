<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
	<meta charset="UTF-8">
	<title layout:title-pattern="$CONTENT_TITLE - Thesis Manager">Thesis Manager</title>
	<link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css">
	<script src="/webjars/jquery/jquery.min.js"></script>
</head>
<body>
<header class="bg-dark text-white p-3">
	<h1 class="h4 m-0">Thesis Manager</h1>
</header>
<div class="d-flex">
	<nav class="bg-light border-end p-3" style="width: 220px; min-height: 100vh;">
		<ul class="nav nav-pills flex-column">
			<li class="nav-item">
				<a class="nav-link" href="/">Home</a>
			</li>

			<li class="nav-item" th:if="${permissions.contains('USERS_READ')}">
				<a class="nav-link" href="/users">Users</a>
			</li>

			<li class="nav-item" th:if="${permissions.contains('USER_CREATE')}">
				<a class="nav-link" href="/users/create">Create user</a>
			</li>

			<li class="nav-item" th:if="${permissions.contains('THESIS_CREATE')}">
				<a class="nav-link" href="/theses/create">Create thesis</a>
			</li>
		</ul>
	</nav>
	<main class="p-4 flex-grow-1" layout:fragment="content">

	</main>
</div>
</body>
</html>
