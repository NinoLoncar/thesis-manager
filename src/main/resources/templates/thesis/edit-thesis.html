<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
	<title>Edit Thesis</title>
	<script th:inline="javascript">
		const thesisId = /*[[${thesisId}]]*/ null;
	</script>
	<script src="/js/thesis/edit-thesis.js"></script>
</head>
<body>
<main layout:fragment="content">
	<h1>Edit Thesis</h1>
	<form>
		<div class="mb-3">
			<label for="title" class="form-label">Title</label>
			<input type="text" id="title" name="title" class="form-control" required>
		</div>
		<div class="mb-3">
			<label for="abstractText" class="form-label">Abstract</label>
			<textarea id="abstractText" name="abstractText" class="form-control" rows="5"></textarea>
		</div>
		<button id="save-thesis-btn" class="btn btn-primary">Save</button>
	</form>
</main>
</body>
</html>
