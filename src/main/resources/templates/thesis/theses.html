<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
	<title>All Theses</title>
	<script src="/js/thesis/theses.js"></script>
</head>
<body>
<main layout:fragment="content">
	<h1>All Theses</h1>
	<form id="filter-form" class="row g-2 mb-3">
		<div class="col-auto">
			<input type="text" id="filter-title" class="form-control" placeholder="Title">
		</div>
		<div class="col-auto">
			<input type="text" id="filter-mentor-name" class="form-control" placeholder="Professor">
		</div>
		<div class="col-auto">
			<select id="filter-reserved" class="form-select">
				<option value="">All</option>
				<option value="true">Reserved</option>
				<option value="false">Not reserved</option>
			</select>
		</div>
		<div class="col-auto">
			<button id="filter-btn" class="btn btn-primary">Search</button>
			<button id="clear-filter-btn" class="btn btn-secondary" type="button">Clear</button>
		</div>
	</form>
	<ul id="theses-list" class="list-group"></ul>
</main>
</body>
</html>
